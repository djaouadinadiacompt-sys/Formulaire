<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formulaire de saisie</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
  .wrap { width: 100%; max-width: 480px; }
  .hdr { text-align: center; margin-bottom: 1.5rem; }
  .hdr h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .hdr p { font-size: 13px; color: #888; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; }
  .card { background: #fff; border: 1px solid #e5e5e0; border-radius: 14px; padding: 1.5rem; margin-bottom: 1rem; }
  label { display: block; font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
  input[type=date], select { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #e5e5e0; border-radius: 8px; background: #fafaf8; color: #1a1a1a; outline: none; transition: border-color 0.15s; margin-bottom: 1rem; }
  input[type=date]:focus, select:focus { border-color: #a3a3a3; }
  .sep { border: none; border-top: 1px solid #f0f0eb; margin: 0.25rem 0 1rem; }
  .btn { width: 100%; padding: 13px; font-size: 15px; font-weight: 600; background: #1a1a1a; border: none; border-radius: 8px; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.15s, transform 0.1s; }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .status { margin-top: 0.75rem; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; align-items: center; gap: 8px; }
  .status.ok   { display: flex; background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  .status.err  { display: flex; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .status.load { display: flex; background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: sp 0.6s linear infinite; flex-shrink: 0; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .counter { font-size: 12px; color: #aaa; text-align: center; margin-top: 0.6rem; }
  .cfg-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: #aaa; margin-top: 0.75rem; user-select: none; }
  .cfg-toggle span.arr { margin-left: auto; transition: transform 0.2s; }
  .cfg-toggle.open span.arr { transform: rotate(180deg); }
  .cfg-box { background: #fafaf8; border: 1px solid #e5e5e0; border-radius: 8px; padding: 1rem; margin-top: 0.75rem; display: none; }
  .cfg-box h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #aaa; margin-bottom: 10px; }
  .dest-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
  .dest-row { display: flex; gap: 6px; }
  .dest-row input { flex: 1; font-size: 13px; padding: 7px 10px; margin-bottom: 0; }
  .dest-row button { width: 30px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid #e5e5e0; border-radius: 8px; background: transparent; cursor: pointer; color: #aaa; font-size: 16px; flex-shrink: 0; }
  .dest-row button:hover { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
  .add-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; cursor: pointer; border: 1px dashed #d5d5d0; border-radius: 8px; padding: 7px 10px; background: transparent; width: 100%; }
  .add-btn:hover { background: #f5f5f0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>Formulaire de saisie</h1>
    <p><span class="dot"></span> Connecté à Google Sheets</p>
  </div>

  <div class="card">
    <label for="dateField">Date</label>
    <input type="date" id="dateField" />

    <label for="destField">Destination</label>
    <select id="destField">
      <option value="">— Sélectionner —</option>
    </select>

    <div class="sep"></div>

    <button class="btn" id="sendBtn" onclick="sendData()">
      ✓ &nbsp;Valider et enregistrer
    </button>

    <div class="status" id="statusBox">
      <span id="statusIco"></span>
      <span id="statusTxt"></span>
    </div>

    <p class="counter" id="counter"></p>

    <div class="cfg-toggle" id="cfgToggle" onclick="toggleCfg()">
      ⚙ <span>Modifier les destinations</span>
      <span class="arr">▾</span>
    </div>

    <div class="cfg-box" id="cfgBox">
      <h3>Destinations</h3>
      <div class="dest-list" id="destList"></div>
      <button class="add-btn" onclick="addDest()">+ Ajouter une destination</button>
    </div>
  </div>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyXdLuhQI0p0WU0FSFFWQQ0MWlPDrv_JPs7g5tynRHGKDCauPq2ixsGgAWxThMzEbLV/exec';

let dests = ['Paris', 'Lyon', 'Marseille', 'Bordeaux'];
let count = 0;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem('gsFormV2') || '{}');
    if (s.dests && s.dests.length) dests = s.dests;
    if (s.count) count = s.count;
  } catch(e) {}
  document.getElementById('dateField').value = new Date().toISOString().split('T')[0];
  renderDests();
  renderSelect();
  updateCounter();
}

function save() {
  localStorage.setItem('gsFormV2', JSON.stringify({ dests, count }));
}

function updateCounter() {
  const el = document.getElementById('counter');
  el.textContent = count > 0 ? `${count} enregistrement${count>1?'s':''} envoyé${count>1?'s':''}` : '';
}

function toggleCfg() {
  const box = document.getElementById('cfgBox');
  const tog = document.getElementById('cfgToggle');
  const open = box.style.display === 'block';
  box.style.display = open ? 'none' : 'block';
  tog.classList.toggle('open', !open);
}

function renderDests() {
  document.getElementById('destList').innerHTML = dests.map((d,i) => `
    <div class="dest-row">
      <input type="text" value="${d}" oninput="dests[${i}]=this.value;renderSelect()" onblur="save()" />
      <button onclick="dests.splice(${i},1);renderDests();save()">✕</button>
    </div>`).join('');
  renderSelect();
}

function addDest() { dests.push(''); renderDests(); }

function renderSelect() {
  const s = document.getElementById('destField');
  const cur = s.value;
  s.innerHTML = '<option value="">— Sélectionner —</option>' +
    dests.filter(d => d.trim()).map(d =>
      `<option value="${d}"${d===cur?' selected':''}>${d}</option>`
    ).join('');
}

function setStatus(type, msg) {
  const b = document.getElementById('statusBox');
  b.className = 'status ' + type;
  document.getElementById('statusIco').innerHTML =
    type==='load' ? '<div class="spin"></div>' :
    type==='ok'   ? '✓' : '✕';
  document.getElementById('statusTxt').textContent = msg;
}

async function sendData() {
  const date = document.getElementById('dateField').value;
  const dest = document.getElementById('destField').value;

  if (!date) { setStatus('err', 'Veuillez saisir une date.'); return; }
  if (!dest) { setStatus('err', 'Veuillez sélectionner une destination.'); return; }

  document.getElementById('sendBtn').disabled = true;
  setStatus('load', 'Envoi en cours...');

  try {
    const url = `${WEB_APP_URL}?date=${encodeURIComponent(date)}&destination=${encodeURIComponent(dest)}`;
    const res = await fetch(url);
    const json = await res.json();

    if (json.status === 'ok') {
      count++;
      save();
      updateCounter();
      setStatus('ok', `"${dest}" – ${date} enregistré !`);
      document.getElementById('dateField').value = new Date().toISOString().split('T')[0];
      document.getElementById('destField').value = '';
    } else {
      setStatus('err', 'Erreur : ' + (json.message || 'réponse inattendue'));
    }
  } catch(err) {
    setStatus('err', 'Erreur réseau. Réessayez.');
  }

  document.getElementById('sendBtn').disabled = false;
}

load();
</script>
</body>
</html>
