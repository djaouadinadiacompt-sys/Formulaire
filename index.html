<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remise Bon d'achat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h2 { color: #1a73e8; text-align: center; margin-bottom: 6px; font-size: 20px; }
    .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; margin-top: 16px; }
    select, input { width: 100%; padding: 12px; border: 1.5px solid #ddd; border-radius: 10px; font-size: 14px; outline: none; transition: border 0.2s; background: #fafafa; }
    select:focus, input:focus { border-color: #1a73e8; background: white; }
    .photo-zone { border: 2px dashed #1a73e8; border-radius: 12px; padding: 30px 20px; text-align: center; cursor: pointer; margin-top: 6px; background: #f8f9ff; transition: all 0.2s; position: relative; }
    .photo-zone:hover { background: #eef2ff; }
    .photo-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .photo-icon { font-size: 36px; margin-bottom: 8px; }
    .photo-text { color: #1a73e8; font-weight: 600; font-size: 14px; }
    .photo-hint { color: #888; font-size: 12px; margin-top: 4px; }
    .preview { width: 100%; border-radius: 10px; margin-top: 12px; display: none; max-height: 200px; object-fit: cover; }
    .btn { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 24px; transition: all 0.2s; }
    .btn:hover { background: #1557b0; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .demandes-list { margin-top: 6px; }
    .demande-item { padding: 12px; border: 1.5px solid #eee; border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
    .demande-item:hover, .demande-item.selected { border-color: #1a73e8; background: #f0f5ff; }
    .demande-num { font-weight: 700; color: #1a73e8; font-size: 15px; }
    .demande-montant { color: #444; font-size: 13px; }
    .success { background: #e8f5e9; border: 1px solid #4caf50; border-radius: 10px; padding: 16px; text-align: center; color: #2e7d32; font-weight: 600; display: none; margin-top: 16px; }
    .error-msg { background: #fdecea; border: 1px solid #f44336; border-radius: 10px; padding: 12px; color: #c62828; font-size: 13px; margin-top: 12px; display: none; }
    .loading { text-align: center; color: #888; padding: 20px; }
    .step { display: none; }
    .step.active { display: block; }
    .back-btn { background: none; border: none; color: #1a73e8; font-size: 13px; cursor: pointer; margin-bottom: 16px; padding: 0; }
  </style>
</head>
<body>
<div class="card">
  <h2>📋 Remise Bon d'achat</h2>
  <p class="subtitle">Soumettez votre bon d'achat facilement</p>

  <!-- Étape 1 : Choisir nom -->
  <div class="step active" id="step1">
    <label>👤 Votre nom</label>
    <select id="selectNom" onchange="chargerDemandes()">
      <option value="">-- Sélectionnez votre nom --</option>
    </select>
    <div id="loadingNoms" class="loading" style="display:none">Chargement...</div>
  </div>

  <!-- Étape 2 : Choisir demande -->
  <div class="step" id="step2">
    <button class="back-btn" onclick="retourStep1()">← Retour</button>
    <label>📝 Choisissez votre demande</label>
    <div class="demandes-list" id="demandesList"></div>
    <div id="loadingDemandes" class="loading" style="display:none">Chargement...</div>
  </div>

  <!-- Étape 3 : Photo -->
  <div class="step" id="step3">
    <button class="back-btn" onclick="retourStep2()">← Retour</button>
    <div style="background:#f0f5ff;border-radius:10px;padding:12px;margin-bottom:16px;">
      <div style="font-size:13px;color:#888;">Demande sélectionnée</div>
      <div style="font-size:16px;font-weight:700;color:#1a73e8;" id="selectedNumero"></div>
      <div style="font-size:13px;color:#444;" id="selectedMontant"></div>
    </div>
    <label>📸 Photo du bon d'achat</label>
    <div class="photo-zone" id="photoZone">
      <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="previewPhoto(this)">
      <div class="photo-icon">📷</div>
      <div class="photo-text">Prendre une photo</div>
      <div class="photo-hint">ou importer depuis la galerie</div>
    </div>
    <img id="previewImg" class="preview">
    <button class="btn" id="btnSoumettre" onclick="soumettre()" disabled>✅ Soumettre le bon</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success" id="successMsg">✅ Bon soumis avec succès !<br><small>Merci !</small></div>
  </div>
</div>

<script>
  // ⚠️ REMPLACE PAR TON URL /exec
  var SCRIPT_URL = '/.netlify/functions/proxy';

  var selectedNom = '';
  var selectedDemande = null;

  function callScript(params) {
    var url = SCRIPT_URL + '?' + Object.keys(params).map(function(k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    var proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
    return fetch(proxyUrl).then(function(r) { return r.json(); }).then(function(data) { return JSON.parse(data.contents); });
  }

  window.onload = function() {
    document.getElementById('loadingNoms').style.display = 'block';
    callScript({ action: 'getDemandeurs' })
      .then(function(demandeurs) {
        document.getElementById('loadingNoms').style.display = 'none';
        var select = document.getElementById('selectNom');
        demandeurs.forEach(function(d) {
          var opt = document.createElement('option');
          opt.value = d; opt.textContent = d;
          select.appendChild(opt);
        });
      })
      .catch(function() {
        document.getElementById('loadingNoms').style.display = 'none';
      });
  };

  function chargerDemandes() {
    selectedNom = document.getElementById('selectNom').value;
    if (!selectedNom) return;

    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');
    document.getElementById('loadingDemandes').style.display = 'block';
    document.getElementById('demandesList').innerHTML = '';

    callScript({ action: 'getDemandes', nom: selectedNom })
      .then(function(demandes) {
        document.getElementById('loadingDemandes').style.display = 'none';
        var list = document.getElementById('demandesList');
        if (demandes.length === 0) {
          list.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">✅ Tous vos bons sont soumis !</p>';
          return;
        }
        demandes.forEach(function(d) {
          var div = document.createElement('div');
          div.className = 'demande-item';
          div.innerHTML = '<span class="demande-num">' + d.numero + '</span><span class="demande-montant">' + (d.montant ? Number(d.montant).toLocaleString('fr-DZ') + ' DZD' : '') + '</span>';
          div.onclick = function() {
            document.querySelectorAll('.demande-item').forEach(function(el) { el.classList.remove('selected'); });
            div.classList.add('selected');
            selectedDemande = d;
            setTimeout(function() {
              document.getElementById('step2').classList.remove('active');
              document.getElementById('step3').classList.add('active');
              document.getElementById('selectedNumero').textContent = d.numero;
              document.getElementById('selectedMontant').textContent = d.montant ? Number(d.montant).toLocaleString('fr-DZ') + ' DZD' : '';
            }, 200);
          };
          list.appendChild(div);
        });
      })
      .catch(function() {
        document.getElementById('loadingDemandes').style.display = 'none';
      });
  }

  function retourStep1() {
    document.getElementById('step2').classList.remove('active');
    document.getElementById('step1').classList.add('active');
  }

  function retourStep2() {
    document.getElementById('step3').classList.remove('active');
    document.getElementById('step2').classList.add('active');
  }

  function previewPhoto(input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = document.getElementById('previewImg');
      img.src = e.target.result;
      img.style.display = 'block';
      document.getElementById('btnSoumettre').disabled = false;
    };
    reader.readAsDataURL(file);
  }

  function soumettre() {
    var btn = document.getElementById('btnSoumettre');
    btn.disabled = true;
    btn.textContent = '⏳ Envoi en cours...';
    document.getElementById('errorMsg').style.display = 'none';

    var file = document.getElementById('fileInput').files[0];
    var reader = new FileReader();
    reader.onload = function(e) {
      var base64 = e.target.result.split(',')[1];
      var mimeType = file.type;

      var data = JSON.stringify({
        numero: selectedDemande.numero,
        photoBase64: base64,
        mimeType: mimeType
      });

      callScript({ action: 'soumettrebon', data: data })
        .then(function(result) {
          if (result.success) {
            btn.style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('photoZone').style.display = 'none';
          } else {
            document.getElementById('errorMsg').textContent = '❌ ' + result.message;
            document.getElementById('errorMsg').style.display = 'block';
            btn.disabled = false;
            btn.textContent = '✅ Soumettre le bon';
          }
        })
        .catch(function(err) {
          document.getElementById('errorMsg').textContent = '❌ Erreur réseau';
          document.getElementById('errorMsg').style.display = 'block';
          btn.disabled = false;
          btn.textContent = '✅ Soumettre le bon';
        });
    };
    reader.readAsDataURL(file);
  }
</script>
</body>
</html>
